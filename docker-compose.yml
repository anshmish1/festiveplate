services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: festiveplate
      POSTGRES_USER: festiveplate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-festiveplate-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festiveplate -d festiveplate"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://festiveplate:${POSTGRES_PASSWORD:-festiveplate-local}@db:5432/festiveplate
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
